<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>Margin capture</title
  ><link rel="stylesheet" href="style.css" />
  <body class="popup">
    <main>
      <h1>Margin</h1>
      <div class="actions">
        <button data-action="save">Save page</button
        ><button data-action="done">Mark Done</button>
      </div>
      <p id="status" role="status">
        Uses the current URL to find details automatically.
      </p>
      <a id="edit" hidden target="_blank" rel="noreferrer"
        >Edit details or visibility in Margin</a
      ><button id="options">Connection & shortcuts</button>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
