# Optional egress host only. Validate with sshd -t before reloading SSH.
# These pinned addresses were resolved for Thinking Machines on 2026-10-25.
# Re-verify them if publisher DNS changes; never broaden to unrestricted forwarding.
Match User margin-egress
    AllowTcpForwarding local
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    PermitTunnel no
    PermitUserRC no
    ForceCommand /bin/false
    MaxSessions 0
    PermitOpen 104.18.0.136:443 104.18.1.136:443
Match all
